<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Profissional - Saúde MaiX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perfil.css">
</head>
<body>

  <div class="perfil-container">

    <div class="perfil-card">
      <img src="../img/foto-perfil.png" alt="Perfil" id="foto-perfil">
      <h1 id="nome-profissional">Carregando...</h1>
      <p id="perfil-profissional">Carregando...</p>
      <span id="email-profissional">Carregando...</span>
    </div>

    <div class="dados-card">
      <h2>Dados Profissionais</h2>

      <div class="info-item">
        <strong>Nome:</strong>
        <span id="nome-dado">Carregando...</span>
      </div>

      <div class="info-item">
        <strong>Cargo / Função:</strong>
        <span id="cargo-dado">Carregando...</span>
      </div>

      <div class="info-item">
        <strong>E-mail:</strong>
        <span id="email-dado">Carregando...</span>
      </div>

      <div class="info-item">
        <strong>Registro Profissional:</strong>
        <span id="registro-dado">Não informado</span>
      </div>

      <button class="btn-editar" onclick="window.location.href='../main/main.html'" style="margin-top: 25px; background: #4534b3;">
        Voltar para o Painel
      </button>
    </div>

  </div>

  <script src="perfil.js"></script>

</body>
</html>
