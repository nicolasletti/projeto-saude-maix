<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Profissional — Saúde MaiX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="../img/logo-borboleta.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perfil.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-mark">
          <img src="../img/logo-borboleta.png" alt="Logo Saúde MaiX" width="35" height="35">
        </div>
        <span class="logo-text">Saúde MaiX</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Menu</span>

      <button class="nav-item" onclick="window.location.href='/pages/main/main.html'">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        Novo Paciente
      </button>

      <button class="nav-item" onclick="window.location.href='/pages/main/main.html'">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Meus Pacientes
      </button>

      <button class="nav-item" onclick="window.location.href='/pages/triagem/triagem.html'">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
        Triagem
      </button>

      <button class="nav-item" onclick="window.location.href='/pages/relatorio/relatorio.html'">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="2" y1="20" x2="22" y2="20"/>
        </svg>
        Relatórios
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card active-perfil">
        <div class="user-avatar" id="avatar-inicial">—</div>
        <div class="user-info">
          <div class="user-nome" id="user-nome">—</div>
          <div class="user-perfil" id="user-perfil">—</div>
        </div>
        <button class="btn-sair" title="Sair" id="btn-sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">Meu Perfil</h1>
        <p class="topbar-sub">Informações do profissional logado</p>
      </div>
    </header>

    <!-- CONTEÚDO -->
    <div class="content">
      <div class="perfil-grid">

        <!-- Card avatar + nome -->
        <div class="form-card perfil-avatar-card">
          <div class="avatar-grande" id="avatar-grande">—</div>

          <input type="file" id="input-foto" accept="image/*" hidden>
          <div class="avatar-actions">
            <button type="button" class="btn-secondary btn-sm" id="btn-alterar-foto">Alterar foto</button>
            <button type="button" class="btn-link" id="btn-remover-foto" hidden>Remover</button>
          </div>

          <h2 class="perfil-nome" id="perfil-nome">—</h2>
          <span class="perfil-cargo" id="perfil-cargo">—</span>
          <span class="perfil-email-sub" id="perfil-email-sub">—</span>
        </div>

        <!-- Card dados profissionais -->
        <div class="form-card">
          <h2 class="form-section-title">Dados Profissionais</h2>

          <div class="info-row">
            <span class="info-label">Nome</span>
            <span class="info-value" id="dado-nome">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Cargo / Função</span>
            <span class="info-value" id="dado-cargo">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">E-mail</span>
            <span class="info-value" id="dado-email">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Registro Profissional</span>
            <span class="info-value" id="dado-registro">Não informado</span>
          </div>

          <div class="form-actions" style="margin-top: 24px;">
            <button class="btn-secondary" onclick="window.location.href='/pages/main/main.html'">
              Voltar ao Painel
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="perfil.js"></script>
</body>
</html>
