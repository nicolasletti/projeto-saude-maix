<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Saúde MaiX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css">
</head>
<body>

  <div class="page">

    <div class="login-card">

      <!-- PAINEL ESQUERDO — brand + borboleta animada -->
      <div class="panel-left">
        <div class="brand">
          <div class="logo-mark">SX</div>
          <span class="logo-text">Saúde MaiX</span>
        </div>

        <div class="butterfly-scene">
          <div class="butterfly-container">
            <svg class="butterfly-svg" viewBox="0 0 200 165" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="wingUL" cx="35%" cy="45%" r="65%">
                  <stop offset="0%" stop-color="#8b7ff5"/>
                  <stop offset="60%" stop-color="#5645d4"/>
                  <stop offset="100%" stop-color="#2e1e9a"/>
                </radialGradient>
                <radialGradient id="wingUR" cx="65%" cy="45%" r="65%">
                  <stop offset="0%" stop-color="#8b7ff5"/>
                  <stop offset="60%" stop-color="#5645d4"/>
                  <stop offset="100%" stop-color="#2e1e9a"/>
                </radialGradient>
                <radialGradient id="wingLL" cx="40%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#5645d4"/>
                  <stop offset="100%" stop-color="#1e1270"/>
                </radialGradient>
                <radialGradient id="wingLR" cx="60%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#5645d4"/>
                  <stop offset="100%" stop-color="#1e1270"/>
                </radialGradient>
              </defs>

              <!-- Grupo asa esquerda -->
              <g class="wing-left">
                <path fill="url(#wingUL)" d="M 100,78 C 85,60 55,35 20,38 C 5,42 3,62 18,72 C 35,82 70,82 100,80 Z"/>
                <path fill="url(#wingLL)" d="M 100,80 C 82,92 58,105 42,122 C 30,135 42,148 62,138 C 82,128 97,105 100,84 Z"/>
                <!-- veias asa superior esquerda -->
                <path d="M 100,79 Q 70,65 40,50" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
                <path d="M 100,79 Q 60,72 25,68" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" fill="none"/>
                <path d="M 100,79 Q 75,78 35,76" stroke="rgba(255,255,255,0.14)" stroke-width="0.8" fill="none"/>
                <!-- mancha ocular superior esquerda -->
                <circle cx="52" cy="56" r="9"   fill="rgba(255,255,255,0.16)"/>
                <circle cx="52" cy="56" r="6"   fill="rgba(255,255,255,0.30)"/>
                <circle cx="52" cy="56" r="3"   fill="#2e1e9a"/>
                <circle cx="50.5" cy="54.5" r="1.2" fill="rgba(255,255,255,0.65)"/>
                <!-- pontos decorativos -->
                <circle cx="28" cy="54" r="2.5" fill="rgba(255,255,255,0.26)"/>
                <circle cx="18" cy="67" r="2"   fill="rgba(255,255,255,0.20)"/>
                <!-- veias asa inferior esquerda -->
                <path d="M 100,82 Q 72,98 55,118"  stroke="rgba(255,255,255,0.18)" stroke-width="0.8" fill="none"/>
                <path d="M 100,82 Q 80,108 68,130" stroke="rgba(255,255,255,0.13)" stroke-width="0.8" fill="none"/>
                <!-- mancha inferior esquerda -->
                <circle cx="60" cy="115" r="5"   fill="rgba(255,255,255,0.13)"/>
                <circle cx="60" cy="115" r="2.5" fill="rgba(255,255,255,0.20)"/>
              </g>

              <!-- Grupo asa direita -->
              <g class="wing-right">
                <path fill="url(#wingUR)" d="M 100,78 C 115,60 145,35 180,38 C 195,42 197,62 182,72 C 165,82 130,82 100,80 Z"/>
                <path fill="url(#wingLR)" d="M 100,80 C 118,92 142,105 158,122 C 170,135 158,148 138,138 C 118,128 103,105 100,84 Z"/>
                <!-- veias asa superior direita -->
                <path d="M 100,79 Q 130,65 160,50" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
                <path d="M 100,79 Q 140,72 175,68" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" fill="none"/>
                <path d="M 100,79 Q 125,78 165,76" stroke="rgba(255,255,255,0.14)" stroke-width="0.8" fill="none"/>
                <!-- mancha ocular superior direita -->
                <circle cx="148" cy="56" r="9"   fill="rgba(255,255,255,0.16)"/>
                <circle cx="148" cy="56" r="6"   fill="rgba(255,255,255,0.30)"/>
                <circle cx="148" cy="56" r="3"   fill="#2e1e9a"/>
                <circle cx="146.5" cy="54.5" r="1.2" fill="rgba(255,255,255,0.65)"/>
                <!-- pontos decorativos -->
                <circle cx="172" cy="54" r="2.5" fill="rgba(255,255,255,0.26)"/>
                <circle cx="182" cy="67" r="2"   fill="rgba(255,255,255,0.20)"/>
                <!-- veias asa inferior direita -->
                <path d="M 100,82 Q 128,98 145,118" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" fill="none"/>
                <path d="M 100,82 Q 120,108 132,130" stroke="rgba(255,255,255,0.13)" stroke-width="0.8" fill="none"/>
                <!-- mancha inferior direita -->
                <circle cx="140" cy="115" r="5"   fill="rgba(255,255,255,0.13)"/>
                <circle cx="140" cy="115" r="2.5" fill="rgba(255,255,255,0.20)"/>
              </g>

              <!-- Corpo -->
              <ellipse cx="100" cy="84" rx="4" ry="19" fill="rgba(255,255,255,0.88)"/>
              <!-- Cabeça -->
              <circle cx="100" cy="63" r="5.5" fill="rgba(255,255,255,0.88)"/>
              <circle cx="98.5" cy="61.5" r="1.5" fill="rgba(255,255,255,0.55)"/>
              <!-- Antenas -->
              <path d="M 98,59 Q 84,42 74,27"   stroke="rgba(255,255,255,0.70)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <circle cx="74"  cy="27" r="3.5"  fill="rgba(255,255,255,0.76)"/>
              <path d="M 102,59 Q 116,42 126,27" stroke="rgba(255,255,255,0.70)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <circle cx="126" cy="27" r="3.5"  fill="rgba(255,255,255,0.76)"/>
            </svg>
          </div>

          <!-- Partículas flutuantes -->
          <div class="particle" style="bottom:28%;left:18%;animation-delay:0s;animation-duration:3.2s;"></div>
          <div class="particle" style="bottom:22%;left:38%;animation-delay:0.9s;animation-duration:2.8s;"></div>
          <div class="particle" style="bottom:38%;left:67%;animation-delay:1.6s;animation-duration:3.6s;"></div>
          <div class="particle" style="bottom:18%;left:76%;animation-delay:0.4s;animation-duration:3.0s;"></div>
          <div class="particle" style="bottom:32%;left:52%;animation-delay:2.1s;animation-duration:2.6s;"></div>
          <div class="particle" style="bottom:14%;left:44%;animation-delay:1.3s;animation-duration:3.9s;"></div>
          <div class="particle" style="bottom:48%;left:22%;animation-delay:2.6s;animation-duration:2.9s;"></div>
          <div class="particle" style="bottom:42%;left:82%;animation-delay:0.7s;animation-duration:3.4s;"></div>
        </div>

        <div class="brand-tagline">
          <h2>Triagem clínica para Síndrome do X Frágil</h2>
          <p>Identifique indicadores com precisão e gere relatórios para acompanhamento dos pacientes.</p>
        </div>

        <div class="brand-bar"></div>
      </div>

      <!-- PAINEL DIREITO — formulário -->
      <div class="panel-right">

        <button class="btn-tema" id="temaBtn" onclick="TrocadeTema()">
          <img id="sunIcon" src="../img/logo-sol.png" alt="Tema claro">
          <img id="moonIcon" src="../img/logo-lua.png" alt="Tema escuro" style="display:none">
        </button>

        <div class="form-wrapper">
          <div class="form-header">
            <h1 class="form-title">Entre na sua conta</h1>
            <p class="form-sub">Acesse sua conta e continue de onde parou.</p>
          </div>

          <form id="form-login" onsubmit="return false">
            <div class="form-field">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email">
            </div>

            <div class="form-field">
              <label for="password">Senha</label>
              <input type="password" id="password" name="senha" placeholder="••••••••" autocomplete="current-password">
              <img src="../img/visibility_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" id="togglePassword" class="eye-icon" alt="Mostrar senha" onclick="TogglePasswordVisibility()">
            </div>

            <button type="button" class="btn-primary" onclick="Entrar()">Entrar</button>
          </form>

          <p class="form-footer">
            Sem acesso?
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=suporte.saudemaix@gmail.com&su=Suporte%20Sa%C3%BAde%20Maix%20-%20Dificuldade%20de%20Acesso&body=Ol%C3%A1,%0A%0AN%C3%A3o%20tenho%20uma%20conta%20ou%20estou%20com%20problemas%20para%20acessar%20a%20plataforma.%0A%0AMeu%20nome%20completo:%20%0AMeu%20CPF:%20%0A%0AO%20que%20o(a)%20senhor(a)%20deseja?%20" target="_blank" rel="noopener">
              Contato com o suporte
            </a>
          </p>
        </div>

      </div>
    </div>

  </div>

  <script src="./login.js"></script>
</body>
</html>
