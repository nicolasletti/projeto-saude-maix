<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Saúde Maix</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./login.css">
    <script src="./login.js"></script>
</head>
<body>
    
    <div class="container">
        <button id="temaBtn" onclick="TrocadeTema()">
            <img id="sunIcon" src="../img/logosol.png">
            <img id="moonIcon" src="../img/logolua.png" style="display: none;">
        </button>
        <div class="left-panel">
            <h2>Bem-vindo</h2>
            <p>Acesse sua conta e continue de onde parou.</p>
            <div class="destaque"></div>
        </div>
        <div class="right-panel">
            <img src="../img/saudemaix-subtitle-deitado.png" alt="Descrição da imagem">
            <h2>Entre na sua conta</h2>
            <label for="email">Email:</label>
            <input type="text" name="email" id="email" class="input-field"/>
            <label for="password">Senha:</label>
            <input type="password" name="senha" id="password" class="input-field"/>
            <button onclick="Entrar()">Entrar</button>
            <p>Não tem uma conta? <a href="https://mail.google.com/mail/?view=cm&fs=1&to=suporte.saudemaix@gmail.com&su=Suporte%20Sa%C3%BAde%20Maix%20-%20Dificuldade%20de%20Acesso&body=Ol%C3%A1,%0A%0AN%C3%A3o%20tenho%20uma%20conta%20ou%20estou%20com%20problemas%20para%20acessar%20a%20plataforma.%0A%0AMeu%20nome%20completo:%20%0AMeu%20CPF:%20%0A%0AO%20que%20o(a)%20senhor(a)%20deseja?%20" target="_blank">Contato com o suporte!</a></p>
        </div>
    </div>
</body>
</html>
