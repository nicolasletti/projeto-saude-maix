<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="checklist.css">
        <script src="checklist.js"></script>
        <title>Saúde MaiX - Formulário Clínico</title>
    </head>
    <body>
        <div class="container">
            <div class="form-padrao">
                <form id="checklist-form"> 
                    <div class="titulo">
                        Saúde MaiX
                    </div> 
                    <h2>Checklist Clínico</h2>

                    <h3>Localizar Ficha</h3>
                    <input type="text" name="busca_paciente" placeholder="Digite o CPF ou Nome do Paciente" required> <br>
                    <button type="button" onclick="BuscarPaciente()" style="background-color: #555;" >Buscar Histórico</button> <br>

                    <h3>Validação de Sinais Clínicos</h3>
                    <p>Confirme os indicadores observados em consultório:</p>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" value="deficiencia_intelectual"> Deficiência Intelectual</label>
                        <label class="checkbox-item"><input type="checkbox" value="dificuldade_aprendizagem"> Dificuldades de aprendizagem</label>
                        <label class="checkbox-item"><input type="checkbox" value="macroorquidismo"> Macroorquidismo (Apenas Masc.)</label>
                        <label class="checkbox-item"><input type="checkbox" value="hipermobilidade"> Hipermobilidade articular</label>
                    </div>

                    <h3>Conduta e Prontuário</h3>
                    <textarea name="conduta_medica" placeholder="Registre a conduta clínica adotada..." rows="4" required></textarea> <br>

                    <button type="button" onclick="GerarRelatorioRisco()" name="salvar_relatorio">Gerar Relatório de Risco</button> <br>
                </form>
            </div>
        </div>
    </body>
</html>
