<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saúde MaiX — Relatórios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="../img/logo-borboleta.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" r
  1el="stylesheet">
  <link rel="stylesheet" href="relatorio.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-mark">
          <img src="../img/logo-borboleta.png" alt="Logo Saúde MaiX" width="35" height="35">
        </div>
        <span class="logo-text">Saúde MaiX</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Menu</span>

      <button class="nav-item" data-href="/pages/main/main.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        Novo Paciente
      </button>

      <button class="nav-item" data-href="/pages/main/main.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Meus Pacientes
      </button>

      <button class="nav-item" data-href="/pages/triagem/triagem.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
        Triagem
      </button>

      <button class="nav-item active" data-href="/pages/relatorio/relatorio.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="2" y1="20" x2="22" y2="20"/>
        </svg>
        Relatórios
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card" id="user-card-perfil" title="Ver perfil" style="cursor:pointer;">
        <div class="user-avatar" id="avatar-inicial">A</div>
        <div class="user-info">
          <div class="user-nome" id="user-nome">—</div>
          <div class="user-perfil" id="user-perfil">—</div>
        </div>
        <button class="btn-sair" title="Sair" id="btn-sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">Relatórios</h1>
        <p class="topbar-sub">Pacientes com relatório de triagem gerado</p>
      </div>
    </header>

    <!-- CONTEÚDO -->
    <div class="content">

      <div class="pane active">
        <div class="lista-header">
          <div class="search-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="busca-input" placeholder="Buscar por nome...">
          </div>
          <button class="btn-secondary" id="btn-atualizar">Atualizar</button>
        </div>

        <div class="table-wrapper">
          <table class="patients-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Sexo</th>
                <th>Data da triagem</th>
                <th>Nível de risco</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-relatorios">
              <tr class="empty-row">
                <td colspan="6">
                  <div class="empty-state">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="18" y1="20" x2="18" y2="10"/>
                      <line x1="12" y1="20" x2="12" y2="4"/>
                      <line x1="6" y1="20" x2="6" y2="14"/>
                      <line x1="2" y1="20" x2="22" y2="20"/>
                    </svg>
                    <p>Nenhum relatório encontrado</p>
                    <span>Realize uma triagem para gerar relatórios</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="relatorio.js"></script>
</body>
</html>
