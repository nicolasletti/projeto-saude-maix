<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="triagem.css">
        <script src="triagem.js"></script>
        <title>Saúde MaiX - Ficha de Triagem</title>
    </head>
    <body>
        <div class="container">
            <div class="form-triagem">
                <form id="triagem-form"> 
                    <div class="titulo">
                        Saúde MaiX
                    </div> 
                    <h2>Pré-Triagem</h2>

                    <h3>Paciente</h3>
                    <input type="text" name="paciente_nome" placeholder="Nome Completo do Paciente" required> <br>
                    <input type="date" name="paciente_nascimento" required> <br>
                    <select name="paciente_sexo" required>
                        <option value="" disabled selected>Sexo Biológico</option>
                        <option value="M">Masculino</option>
                        <option value="F">Feminino</option>
                        <option value="W">Wilson</option>
                    </select> <br>

                    <h3>Responsável Legal</h3>
                    <input type="text" name="responsavel_nome" placeholder="Nome do Responsável" required> <br>
                    <input type="text" name="responsavel_parentesco" placeholder="Grau de Parentesco" required> <br>

                    <h3>Sintomas Observados</h3>
                    <div class="checkbox-group">
                        <input type="checkbox" id="sintoma1" value="atraso_fala"> <label for="sintoma1">Atraso na fala</label> <br>
                        <input type="checkbox" id="sintoma2" value="face_alongada"> <label for="sintoma2">Face alongada/orelhas</label> <br>
                        <input type="checkbox" id="sintoma3" value="hiperatividade"> <label for="sintoma3">Hiperatividade</label> <br>
                        <input type="checkbox" id="sintoma4" value="evita_contato"> <label for="sintoma4">Evita contato visual</label> <br>
                    </div>

                    <button type="button" name="enviar" onclick="EnviarTriagem()">Enviar Avaliação</button> <br>
                </form>
            </div>
        </div>
    </body>
</html>
